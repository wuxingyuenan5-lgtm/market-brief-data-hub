schema_version: 2
policy_id: shared_market_calendar_and_publication_v2
status: active
updated_at: '2026-08-02T22:26:00+08:00'
purpose: 两份晨报共用的交易日、节假日、特殊休市和发布判定规则；必须依据交易所官方日历及临时公告，不得仅按星期、法定节假日或政府调休表判断

timezone: Asia/Shanghai

calendar_authority:
  source_priority:
    - official_exchange_temporary_notice
    - official_exchange_trading_calendar
    - official_market_operator_notice
    - official_regulator_or_clearing_notice
    - authoritative_news_confirmation_only_as_cross_check
  temporary_notice_overrides_annual_calendar: true
  government_workday_calendar_is_not_market_calendar: true
  weekday_only_inference_prohibited: true
  official_evidence_required_for_open_or_closed_claim: true
  special_notice_lookback_hours: 72
  required_event_types:
    - statutory_or_exchange_holiday
    - special_closure
    - open_half_day
    - early_close
    - delayed_open
    - technical_halt
    - resumed_trading

market_calendar_sources:
  SSE: [sse_official_calendar, sse_temporary_notices]
  SZSE: [szse_official_calendar, szse_temporary_notices]
  BSE: [bse_official_calendar, bse_temporary_notices]
  HKEX: [hkex_official_calendar, hkex_market_arrangements]
  SHFE: [shfe_official_calendar, shfe_notices]
  INE: [ine_official_calendar, ine_notices]
  DCE: [dce_official_calendar, dce_notices]
  CZCE: [czce_official_calendar, czce_notices]
  GFEX: [gfex_official_calendar, gfex_notices]
  CFFEX: [cffex_official_calendar, cffex_notices]
  NYSE: [nyse_official_calendar, nyse_notices]
  NASDAQ: [nasdaq_official_calendar, nasdaq_notices]
  CME: [cme_official_calendar, cme_special_notices]
  ICE_US: [ice_official_calendar, ice_notices]
  LME: [lme_official_calendar, lme_notices]

market_groups:
  domestic_primary:
    - SSE
    - SZSE
    - BSE
    - HKEX
    - SHFE
    - INE
    - DCE
    - CZCE
    - GFEX
    - CFFEX
  cross_asset_primary:
    - NYSE
    - NASDAQ
    - CME
    - ICE_US
    - LME
    - SSE
    - SZSE
    - BSE
    - HKEX
    - SHFE
    - INE
    - DCE
    - CZCE
    - GFEX
    - CFFEX
  continuous_markets:
    - CRYPTO_SPOT
    - CRYPTO_DERIVATIVES
  continuous_market_rule: 连续市场不得单独触发周日或传统市场全休时的晨报

session_states:
  allowed:
    - open_full_day
    - open_half_day
    - delayed_open
    - early_close
    - scheduled_holiday
    - special_closure
    - technical_halt
    - resumed_after_halt
    - unknown_pending_verification
  open_states:
    - open_full_day
    - open_half_day
    - delayed_open
    - early_close
    - resumed_after_halt
  closed_states:
    - scheduled_holiday
    - special_closure
    - technical_halt
  unknown_action: 不得假定开市；继续核验官方日历与临时公告

run_resolution:
  must_run_before_market_data_collection: true
  required_fields:
    - report_date_beijing
    - weekday_beijing
    - yesterday_state_by_market
    - today_state_by_market
    - latest_valid_session_date_by_market
    - latest_valid_session_timestamp_by_market
    - official_calendar_source_by_market
    - temporary_notice_checked_at
    - publication_mode
    - publication_reason
    - weekly_module_due
    - weekly_module_already_delivered_this_iso_week
  steps:
    - 读取本周、下周一及最近有效交易日的官方交易日历
    - 检查过去72小时官方临时公告
    - 分市场识别法定节假日、特殊休市、半日市、提前收市、延迟开市和技术性停市
    - 分别确定昨日、今日及最近有效交易时段
    - 使用对应晨报primary市场组判断发布模式
    - 发布时逐资产保留真实市场时点

publication_decision:
  domestic_general_rule: 昨日与今日所有domestic_primary市场均休市时静默跳过
  cross_asset_general_rule: 昨日与今日所有cross_asset_primary市场均休市时静默跳过
  publish_when:
    - 昨日至少一个对应primary市场存在有效交易时段
    - 今日至少一个对应primary市场按官方安排开市
    - 今日存在官方确认的特殊或补充交易时段
  skip_when:
    - 昨日与今日所有对应primary市场均处于closed_states
    - 所有相关市场状态均无法核验且没有官方开市依据
  silent_skip_behavior:
    generate_report: false
    generate_html: false
    create_archive: false
    send_message: false
    send_failure_notice: false

weekday_rules:
  saturday:
    publish_if: 周五至少一个对应primary市场存在有效交易时段
    publication_mode: saturday_friday_summary
    content:
      - 使用周五各市场最近有效交易数据
      - 纳入周五收盘后至周六截止时间的重要信息
      - 半日市或提前收市必须标注流动性和成交不可与完整交易日直接比较
  sunday:
    default: silent_skip
    exception: 仅当交易所官方安排至少一个对应primary市场为正式或特殊交易日时发布
    continuous_market_cannot_trigger: true
  monday:
    publish_if: 当日至少一个对应primary市场开市
    data_basis: 上一个有效交易日数据加周末信息
    weekly_module_due: true
    if_all_primary_closed: 静默跳过并将周度模块递延
  deferred_first_open_day:
    condition: 周一全部相关primary市场休市且本周尚未展示周度模块
    action: 在本周第一个满足发布条件的开市日展示周度模块
    once_per_week: true
  tuesday_to_friday:
    rule: 按general_rule执行
    reopen_after_holiday: 使用各市场最近有效交易日并整合休市期间新增信息

weekly_module:
  visible_once_per_iso_week: true
  due: 周一；若周一不满足发布条件则递延至本周第一个满足发布条件的开市日
  required_sections:
    - 本周交易日与假期安排
    - 本周重要宏观、政策、财报、产业和商品事件
    - 本周主要风险与验证节点
  event_requirements:
    - 仅列官方确认或有明确日程的事件
    - 暂定事件必须标注暂定
    - 每项写明北京时间、影响市场和验证变量
    - 国内晨报只纳入中国事件及有明确中国资产传导的海外事件
  once_per_week_check_sources:
    - existing_historical_archives
    - prior_successful_task_output_when_available
  prohibit_duplicate_weekly_module_same_iso_week: true

partial_market_open:
  publish_allowed: true
  rules:
    - 每个市场独立显示最近有效交易时点
    - 休市市场不得用ETF、期货或其他代理值替代正式收盘
    - 不得把不同交易日的涨跌幅伪装成同一时点横截面
    - 休市期间新闻可纳入，但价格反应等待对应市场复市确认
    - 半日市、提前收市和延迟开市必须显著标注

multi_market_consistency:
  rules:
    - 同一晨报允许资产使用不同最近有效交易日，但必须逐项标明
    - 在岸与离岸人民币、指数与ETF、现货与期货及不同合约月份不得互相替代
    - 技术性停市期间不得沿用停市前旧报价作为新报价
    - 复市首日说明休市期间累计信息和价格缺口风险

report_specific_application:
  domestic:
    primary_group: domestic_primary
    monday_scope: 中国内地与香港交易安排、中国宏观政策、A/H股和国内商品事件；海外事件仅在有明确中国资产传导时纳入
  cross_asset:
    primary_group: cross_asset_primary
    monday_scope: 全球交易所安排、主要宏观与央行、重点财报和商品事件

quality_gate:
  - 发布前必须形成内部publish或silent_skip判定及官方依据
  - 客户页面只展示必要交易安排，不展示内部判定日志
  - 未核验官方交易日历和临时公告不得声称开市或休市
  - silent_skip日不得生成占位HTML、复制旧报告或发送任何消息
  - 部分市场开市时必须保留逐市场真实时点
