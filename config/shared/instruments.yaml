industry_taxonomy:
  canonical:
    taxonomy_id: SW2021
    display_name: 申万2021行业分类
    provider: swsresearch
    levels:
      level1: 一级行业
      level2: 二级行业
      level3: 三级行业
    default_market_view_level: level1
    default_research_drilldown_level: level2
    membership_as_of_report_date: true
    classification_history_required: true
    concepts_and_themes_separate: true
    alternate_industry_taxonomies_prohibited_in_report: true
  aggregation:
    official_index_return_preferred: true
    turnover_breadth_and_stock_count: aggregate_constituents_locally
    fund_flow: aggregate_individual_stock_flow_locally
    constituent_mapping_fields: [stock_code, industry_code, start_date, update_date]
    mapping_version_and_download_time_required: true

normalization_rules:
  never_infer_market_from_ambiguous_six_digit_code: true
  preserve_exchange_and_contract: true
  futures_latest_value_requires_contract: true
  futures_product_alias_not_latest_value: true
  dominant_contract_must_be_derived_not_hardcoded: true
  index_proxy_etf_not_interchangeable: true
  onshore_offshore_fx_not_interchangeable: true
