schema_version: 3
config_id: domestic_automation_delivery_v3
report_id: domestic_cn_v1
status: active
mode: chat_first_verified_archive
purpose: 管理《国内交易晨报》自动任务的聊天正文、HTML、GitHub归档、回读验证、附件和失败回退；不改变版式、研究范围或公共数据口径

timezone: Asia/Shanghai
schedule:
  frequency: daily
  local_time: '08:00'
  enabled: true
  timing_mode: condition_watch

bootstrap_load_order:
  - config/domestic/runtime_manifest.yaml
  - config/shared/report_calendar.yaml

manifest_execution:
  execute_sections:
    - required_config_reads
    - required_pipeline_steps
    - hard_gates
    - weekly_module
    - artifact_identity
    - failure_messages
  chat_memory_substitution_prohibited: true

publication_behavior:
  policy_file: config/shared/report_calendar.yaml
  primary_market_group: domestic_primary
  official_calendar_and_temporary_notice_required: true
  yesterday_and_today_all_primary_closed:
    action: silent_skip
    generate_html: false
    write_archive: false
    send_message: false
  saturday:
    publish_if_friday_had_valid_primary_session: true
    mode: friday_summary
  sunday:
    default: silent_skip
    publish_only_on_official_special_or_regular_trading_day: true
  monday:
    publish_if_any_primary_market_open: true
    use_previous_valid_session_and_weekend_information: true
    include_weekly_module: true
  monday_all_primary_closed:
    action: silent_skip_and_defer_weekly_module
  partial_market_open:
    publish_allowed: true
    require_real_timestamp_per_market: true
    prohibit_proxy_for_closed_market: true

primary_delivery:
  type: standalone_chat_body
  minimum_chinese_characters: 900
  must_be_usable_without_attachment: true
  required_sections:
    - 90秒摘要
    - 已核验市场概览
    - 三条市场主线
    - 两条重要研究更新
    - 今日关注与主要风险
  weekly_sections_when_due:
    - 本周交易日与假期安排
    - 本周重要宏观、政策、财报、产业和商品事件
    - 本周主要风险与验证节点
  prohibit_two_or_three_paragraph_summary_as_complete_delivery: true

market_overview:
  priority_assets:
    - SHCOMP
    - CSI300
    - CSI500
    - CSI1000
    - CHINEXT
    - STAR50
    - HSI
    - HSCEI
    - HSTECH
    - CN10Y
    - DR007
    - USDCNY
    - USDCNH
    - SHFE_GOLD
    - SHFE_COPPER
    - GFEX_LITHIUM
  show_only_verified_values: true
  noncritical_missing_action: omit
  prohibited_substitutions:
    - old_value
    - estimate
    - vague_range
    - etf_for_index
    - futures_for_closed_cash_market
    - different_trading_day_as_same_snapshot
    - different_futures_contract_month
    - stale_cache

fact_ledger:
  required_for_every_exact_number: true
  required_fields:
    - source_id
    - source_url
    - exact_instrument
    - market_or_release_timestamp
    - fetched_at
    - unit
    - currency
    - methodology
  cross_source_consistent_requires_two_retained_source_values: true
  same_number_must_match_across_body_html_chart_and_tracking_table: true

html_artifact:
  required_for_full_success: true
  display_name: 国内交易晨报
  page_title_pattern: 国内交易晨报｜{date}
  h1_pattern: 国内交易晨报｜{date}
  filename_pattern: 国内交易晨报_{date}.html
  local_output_path_pattern: /mnt/data/国内交易晨报_{date}.html
  pipeline_meta_from_runtime_manifest: true
  self_contained: true
  offline_openable: true
  responsive: true
  print_friendly: true
  css_inline: true
  javascript_inline_when_required: true
  external_dependencies: false
  fixed_navigation: true
  details_expand_collapse: true
  print_forces_full_content: true
  max_real_data_charts: 4
  empty_example_or_placeholder_charts: false

html_validation:
  all_checks_required_for_full_success: true
  checks:
    - exact_local_file_exists
    - filename_matches
    - title_matches
    - h1_matches
    - runtime_manifest_pipeline_meta_matches
    - file_size_is_not_empty_shell
    - all_required_report_sections_exist
    - weekly_sections_exist_when_due
    - prohibited_client_terms_absent
    - internal_process_information_absent
    - fact_consistency_passes
    - offline_openable

required_html_sections:
  - 数据截止时间
  - 90秒摘要
  - 隔夜宏观与政策
  - 市场概览
  - 市场主线
  - 研究更新
  - 重点信息
  - 资金、仓位与产业数据
  - 跟踪表
  - 前期观点复盘
  - 今日关注与未来7天事件
  - 数据图表
  - 来源与口径

github_archive:
  enabled: true
  repository: wuxingyuenan5-lgtm/market-brief-data-hub
  allowed_write_scope:
    - reports/domestic/
  prohibited_write_scope:
    - config/cross_asset/
    - reports/cross_asset/
  path_pattern: reports/domestic/{year}/{month}/国内交易晨报_{date}.html
  input_type: complete_utf8_html_string
  temporary_attachment_reference_as_input_prohibited: true
  write_protocol:
    file_missing:
      action: create_file
    file_exists:
      - fetch_file_for_current_sha
      - update_file_with_complete_html_string
  readback_protocol:
    required: true
    action: fetch_file
    verify:
      - file_exists
      - content_not_truncated
      - title_matches
      - h1_matches
      - pipeline_meta_matches_runtime_manifest
      - required_sections_exist
  link_policy:
    provide_only_after_readback_success: true
    unverified_link_prohibited: true
  client_output:
    expose_commit_hash: false
    expose_repository_error_detail: false
    expose_internal_path: false

attachment_delivery:
  priority: optional
  local_path_pattern: /mnt/data/国内交易晨报_{date}.html
  display_name_pattern: 国内交易晨报_{date}.html
  attachment_failure_does_not_block_chat_body: true
  attachment_failure_does_not_block_verified_github_link: true
  show_failure_detail: false

final_delivery:
  success_order:
    - standalone_chat_body
    - verified_github_link
    - optional_html_attachment
  no_internal_process_output: true
  no_commit_hash: true
  no_unverified_link: true

failure_fallback:
  github_write_or_readback_failed:
    send_full_verified_chat_body: true
    omit_github_link: true
    show_error_detail: false
  attachment_failed:
    send_full_verified_chat_body: true
    send_verified_github_link_when_available: true
    show_error_detail: false
  html_failed_after_data_verified:
    send_full_verified_chat_body: true
    append_exact_text: 完整HTML未生成，本次仅发送已核验正文。
  required_config_not_read:
    send_partial_body: false
    fixed_message_from_runtime_manifest: config_or_tool_unavailable
  data_truthfulness_failed:
    send_partial_body: false
    fixed_message_from_runtime_manifest: data_truthfulness_failed
  silent_skip:
    send_anything: false

client_visible_policy:
  prohibited_terms:
    - 当下定价
    - 当前定价
    - 系统性积累
    - 结构性积累
    - 交易层
    - 研究层
    - 真实数据版
    - AI生成
    - 数据体检
    - 质量状态
    - 主线01
    - 主线02
    - 主线03
    - 研究账本ID
    - commit hash
    - 仓库路径
    - GitHub写入状态
  internal_quality_codes_visible_in_primary_tables: false
  internal_quality_codes_allowed_in_data_records_and_methodology: true

runtime_output_policy:
  allow_intermediate_user_messages: false
  silent_skip_sends_no_message: true
  prohibit_tool_status_debug_and_internal_errors: true

non_goals:
  - change_existing_layout
  - change_research_scope
  - change_shared_data_contract
  - write_to_cross_asset_paths
  - treat_attachment_as_primary_delivery
  - provide_unverified_github_links
