schema_version: 3
pipeline_id: domestic_morning_brief_v3
status: active
updated_at: '2026-08-02T22:45:00+08:00'

purpose: 国内交易晨报运行清单；以聊天正文为第一交付物，以回读验证后的GitHub归档为稳定入口，附件仅为可选补充

bootstrap_read_order:
  - config/domestic/runtime_manifest.yaml
  - config/shared/report_calendar.yaml

required_config_reads:
  - config/shared/report_calendar.yaml
  - vendor/upstreams.lock.yaml
  - config/shared/data_contract.yaml
  - config/shared/sources.yaml
  - config/shared/routing.yaml
  - config/shared/quality_rules.yaml
  - config/shared/instruments.yaml
  - config/domestic/preferences.yaml
  - config/domestic/user_experience.yaml
  - config/domestic/client_presentation.yaml
  - config/domestic/content_integrity.yaml
  - config/domestic/automation_delivery.yaml
  - config/domestic/watchlist.yaml
  - config/domestic/research_ledger.yaml
  - config/domestic/event_watchlist.yaml
  - config/domestic/source_overrides.yaml
  - config/domestic/report.yaml
  - docs/DATA_PROTOCOL.md
  - docs/OPERATIONS.md

read_rules:
  runtime_manifest_must_be_first: true
  report_calendar_must_be_second: true
  preserve_exact_order: true
  never_claim_unread_file_was_read: true
  chat_memory_cannot_replace_repository_configuration: true
  missing_or_conflicting_required_config_action: fixed_failure_message

required_pipeline_steps:
  - read_runtime_manifest_from_github
  - read_report_calendar_and_all_required_configs
  - resolve_official_market_calendars_and_temporary_notices
  - decide_publication_mode
  - if_silent_skip_end_without_message_html_or_archive
  - collect_and_normalize_domestic_market_data
  - build_fact_ledger_for_every_exact_number
  - validate_sources_timestamps_units_currency_and_methodology
  - generate_standalone_chat_body_at_least_900_chinese_characters
  - render_complete_self_contained_html
  - validate_title_h1_sections_terms_file_size_and_fact_consistency
  - write_full_utf8_html_string_to_github_archive
  - fetch_github_archive_and_verify_content_integrity
  - deliver_chat_body_verified_github_link_and_optional_attachment

hard_gates:
  all_required_configs_read: true
  official_calendar_resolution_required: true
  temporary_notice_check_required: true
  publication_decision_required: true
  key_number_source_binding_required: true
  chat_body_independent_usability_required: true
  chat_body_min_chinese_characters: 900
  html_generation_required_for_full_success: true
  github_archive_readback_required_for_verified_link: true
  prohibit_unverified_github_link: true
  prohibit_summary_only_success: true
  prohibit_attachment_only_success: true
  prohibit_broken_attachment_as_failure_of_text_delivery: true
  prohibit_unverified_claim_of_pipeline_execution: true
  prohibit_proxy_for_closed_market: true
  prohibit_internal_process_output: true

calendar_resolution:
  policy_file: config/shared/report_calendar.yaml
  primary_market_group: domestic_primary
  official_calendar_required: true
  temporary_official_notice_required: true
  temporary_notice_lookback_hours: 72
  government_workday_or_weekday_inference_prohibited: true

publication_modes:
  allowed:
    - regular_daily
    - saturday_friday_summary
    - monday_weekly_open
    - deferred_weekly_first_open_day
    - partial_market_open
    - silent_skip
  silent_skip:
    condition: yesterday_and_today_all_domestic_primary_markets_closed
    generate_html: false
    write_archive: false
    send_message: false
  saturday_friday_summary:
    condition: saturday_and_friday_had_any_valid_domestic_primary_session
  sunday:
    default: silent_skip
    exception: official_special_or_regular_trading_day_for_any_domestic_primary_market
  partial_market_open:
    allowed: true
    require_market_specific_timestamp: true
    prohibit_proxy_for_closed_market: true

weekly_module:
  due: monday_or_deferred_first_publishable_open_day
  once_per_iso_week: true
  required_sections:
    - 本周交易日与假期安排
    - 本周重要宏观、政策、财报、产业和商品事件
    - 本周主要风险与验证节点
  monday_data_basis: previous_valid_session_plus_weekend_information
  deferral_rule: 周一全部相关市场休市时递延至本周第一个满足发布条件的开市日
  duplicate_check_sources:
    - verified_github_archives
    - prior_successful_task_output_when_available

chat_delivery:
  primary_deliverable: standalone_verified_body
  minimum_chinese_characters: 900
  required_sections:
    - 90秒摘要
    - 已核验市场概览
    - 三条市场主线
    - 两条重要研究更新
    - 今日关注与主要风险
  include_weekly_sections_when_due: true
  attachment_dependency: false

artifact_identity:
  html_meta_name: market-brief-pipeline
  html_meta_content: domestic_morning_brief_v3
  display_name: 国内交易晨报
  page_title_pattern: 国内交易晨报｜{date}
  h1_pattern: 国内交易晨报｜{date}
  filename_pattern: 国内交易晨报_{date}.html
  local_output_path_pattern: /mnt/data/国内交易晨报_{date}.html
  github_archive_path_pattern: reports/domestic/{year}/{month}/国内交易晨报_{date}.html
  encoding: utf-8

archive_protocol:
  enabled: true
  allowed_scope: reports/domestic/
  input_must_be_complete_html_string: true
  temporary_attachment_reference_as_input_prohibited: true
  create_when_missing: create_file
  update_when_existing:
    - fetch_file_for_current_sha
    - update_file_with_complete_html_string
  post_write_validation:
    - fetch_file
    - verify_file_exists
    - verify_title_h1_and_pipeline_meta
    - verify_required_sections
    - verify_content_not_truncated
  expose_link_only_after_readback_success: true
  expose_commit_hash: false
  expose_internal_path: false

failure_messages:
  config_or_tool_unavailable: 今日国内交易晨报未执行完整配置流程，未生成正式版本。
  data_truthfulness_failed: 今日国内交易晨报未通过数据真实性校验，未生成正式版本。
  html_generation_failed_after_verified_data: 完整HTML未生成，本次仅发送已核验正文。

fallback_delivery:
  github_write_failed:
    send_full_verified_chat_body: true
    show_error_detail: false
    provide_unverified_link: false
  attachment_failed:
    send_full_verified_chat_body: true
    send_verified_github_link_when_available: true
    show_attachment_error: false
  html_failed_after_data_verified:
    send_full_verified_chat_body: true
    append_exact_message_from_failure_messages: html_generation_failed_after_verified_data
  required_config_or_truthfulness_failed:
    send_partial_body: false
    use_fixed_failure_message: true

non_goals:
  - modify_cross_asset_configuration
  - modify_cross_asset_reports
  - use_chat_memory_instead_of_github_configuration
  - treat_attachment_as_primary_delivery
  - expose_commit_hash_or_internal_tool_status
