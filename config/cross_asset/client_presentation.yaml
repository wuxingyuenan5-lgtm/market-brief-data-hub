schema_version: 1
policy_id: cross_asset_client_presentation_v1
status: active
purpose: 面向客户输出简洁、自然、专业的晨报页面，不暴露内部研究分类和生成过程术语

client_copy_rules:
  report_title: 跨资产交易晨报
  h1_pattern: 跨资产交易晨报｜{date}
  allow_internal_taxonomy_in_visible_copy: false
  prohibited_visible_labels:
    - 当下定价
    - 系统性积累
    - 真实数据版
    - 当前定价
    - 结构性积累
    - 交易层
    - 研究层
    - 模型判断
    - AI生成
    - 数据体检
    - 质量状态
  prohibited_decorative_badges:
    - 主线01
    - 主线02
    - 主线03
    - 当下定价01
    - 当下定价02
    - 当下定价03
  exception:
    - 仅在来源与方法章节中允许出现必要的数据口径术语
    - 仅在内部HTML属性、CSS类名、配置文件和仓库日志中保留内部分类

preferred_visible_section_names:
  decision_90_seconds: 90秒摘要
  overnight_macro: 隔夜宏观
  market_map: 市场概览
  current_pricing_three_themes: 市场主线
  structural_research_two_to_four: 研究更新
  research_accumulation_trial: 研究跟踪
  five_quick_updates: 重点信息
  flow_positioning_industry: 资金、仓位与产业数据
  dual_ledger: 跟踪表
  prior_view_review: 前期观点复盘
  catalysts_and_seven_day_calendar: 今日关注与未来7天事件
  sources_and_methodology: 来源与口径

hero:
  visible_badges: false
  show_only:
    - report_title
    - one_paragraph_thesis
    - report_date
    - data_cutoff
    - main_market_timestamps
    - coverage
  remove_version_marketing_copy: true
  remove_process_copy: true

cards_and_tables:
  use_plain_language_headings: true
  avoid_repeating_section_taxonomy_inside_each_card: true
  avoid_explaining_obvious_ui_elements: true
  no_decorative_status_badge_without_information_value: true
  status_words_allowed_only_when_they_describe_a_real_change:
    - 新增
    - 强化
    - 弱化
    - 证伪
    - 延续

navigation_labels:
  decision: 摘要
  macro: 宏观
  map: 市场
  pricing: 主线
  research: 研究
  data: 数据
  ledger: 跟踪
  calendar: 日历

quality_checks:
  - hero区域不得出现内部分类徽章
  - 每张卡片不得重复显示所属模块名称
  - 客户页面不得出现“真实数据版”或类似自我证明式文案
  - 页面标题、下载文件名和归档文件名必须一致
  - 客户可见文字应说明事实和结论，不说明生成流程
