schema_version: 4
report_id: cross_asset_v4
display_name: 跨资产交易晨报
edition: V4
timezone: Asia/Shanghai
scheduled_time: '08:00'
filename_pattern: 跨资产交易晨报_{date}.html

artifact_naming:
  enforced: true
  config_path: config/cross_asset/artifact_naming.yaml
  display_title_pattern: 跨资产交易晨报｜{date}
  filename_pattern: 跨资产交易晨报_{date}.html
  attachment_name_pattern: 跨资产交易晨报_{date}.html
  prohibit_generic_names: [preview, report, output, index, artifact]
  require_real_file_before_delivery: true

format_baseline:
  id: cross_asset_v4_2026_07_31
  name: 跨资产交易晨报2026-07-31格式
  spec_path: config/cross_asset/format_baseline.yaml
  source_artifact: 跨资产交易晨报_2026-07-31.html
  locked_default: true
  change_policy: explicit_user_approval_required
  default_behavior: 保持版式、导航、模块顺序与视觉语义，只更新真实数据、研究内容、图表和来源

load_order:
  - vendor/upstreams.lock.yaml
  - config/shared/data_contract.yaml
  - config/shared/sources.yaml
  - config/shared/routing.yaml
  - config/shared/quality_rules.yaml
  - config/shared/instruments.yaml
  - config/cross_asset/artifact_naming.yaml
  - config/cross_asset/format_baseline.yaml
  - config/cross_asset/section_design.yaml
  - config/cross_asset/research_accumulation.yaml
  - config/cross_asset/research_ledger.yaml
  - config/cross_asset/user_experience.yaml
  - config/cross_asset/report.yaml

coverage:
  macro: [US, CN, GLOBAL]
  assets:
    - precious_metals
    - copper
    - lithium
    - crypto
    - cn_equities
    - hk_equities
    - us_equities
    - ai_technology

market_map:
  required:
    - SPX
    - NDX
    - SOX
    - CSI300
    - HSTECH
    - BTCUSDT
    - ETHUSDT
    - GOLD_SPOT
    - SILVER_SPOT
    - LME_COPPER
    - GFEX_LITHIUM
    - DXY
    - US2Y
    - US10Y
    - US10Y_REAL
    - BRENT
    - VIX
  columns:
    - asset
    - latest_value
    - daily_change
    - market_timestamp
    - quality_status
    - explanation

macro_module:
  fixed: true
  fields: [actual, consensus, previous, revision, market_reaction, transmission_path]
  topics:
    - growth
    - inflation
    - employment
    - central_bank
    - yield_curve
    - dollar

decision_layer:
  preserve_original: true
  no_new_systematic_decision_framework: true
  sections:
    - decision_90_seconds
    - current_pricing_three_themes
    - catalysts_and_risks
  rule: 保持2026-07-31基线原有表达，不增加仓位建议、交易指令、阈值触发或最优表达工具栏目

section_design:
  enabled: true
  config_path: config/cross_asset/section_design.yaml
  approved_on: '2026-07-31'
  approved_scope:
    - current_pricing_three_themes
    - flow_positioning_industry
    - dual_ledger
  preserve_section_order: true
  current_pricing:
    required_count: 3
    require_sector_rotation: true
    add_rotation_strip: true
    rotation_must_use_relative_benchmark: true
    required_fields:
      - headline
      - new_fact_or_catalyst
      - cross_asset_price_expression
      - sector_rotation
      - flow_or_positioning_confirmation
      - industry_or_fundamental_confirmation
      - pricing_stage
      - divergence_or_unresolved_point
      - next_validation_node
  flow_positioning_industry:
    separate_layers:
      - market_flow
      - positioning
      - industry_data
    include_evidence_alignment_table: true
    evidence_alignment_is_not_trade_advice: true
    show_only_material_updates: true
  dual_ledger:
    preserve_two_table_layout: true
    trading_table_name: 市场定价账本
    research_table_name: 基本面研究账本
    require_stable_ids: true
    require_cross_links: true
    highlight_changes_only: true
    preserve_history_in_research_ledger: true

crypto_policy:
  daily_policy_section: false
  include_only_if_material: true
  material_topics:
    - legislation
    - regulatory_implementation
    - judicial_decision
    - banking_custody
    - stablecoin
    - rwa
    - licensing
    - market_structure

report_sections:
  - hero
  - decision_90_seconds
  - overnight_macro
  - validated_charts
  - market_map
  - current_pricing_three_themes
  - structural_research_two_to_four
  - research_accumulation_trial
  - five_quick_updates
  - flow_positioning_industry
  - dual_ledger
  - prior_view_review
  - catalysts_and_seven_day_calendar
  - sources_and_methodology
  - disclaimer

research_accumulation:
  enabled: true
  trial: true
  config_path: config/cross_asset/research_accumulation.yaml
  ledger_path: config/cross_asset/research_ledger.yaml
  first_review_date: '2026-08-01'
  removable_without_format_migration: true
  display_increment_only: true

user_experience:
  enabled: true
  config_path: config/cross_asset/user_experience.yaml
  default_view: full
  preserve_baseline_reading_order: true
  features:
    - reading_modes
    - change_highlighting
    - traceable_claim_links
  detailed_audit_client_visible: false

archive_policy:
  enabled: true
  repository: wuxingyuenan5-lgtm/market-brief-data-hub
  branch: main
  target_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html
  archive_same_artifact_as_delivery: true
  archive_only_completed_report: true
  commit_message_pattern: 'archive: add cross-asset morning brief {date}'
  on_write_failure:
    deliver_report_anyway: true
    disclose_backup_failure: true
    do_not_claim_success: true

chat_summary:
  include_only:
    - decision_90_seconds
    - current_pricing_three_themes
    - top_two_structural_updates
    - catalysts_and_risks

research_requirements:
  current_pricing_theme_fields:
    - theme_id
    - new_fact
    - actual_consensus_previous_or_prior_assumption
    - cross_asset_price_expression
    - sector_rotation
    - flow_or_positioning_confirmation
    - industry_or_fundamental_confirmation
    - already_priced
    - not_yet_reflected
    - horizon
    - pricing_stage
    - validation_variables
    - counter_evidence
    - falsification_condition
  structural_update_fields:
    - research_topic
    - stable_ledger_id
    - new_information
    - stage
    - changed_fundamental_variable
    - valuation_framework_impact
    - relation_to_prior_conclusion
    - next_tracking_node

chart_policy:
  maximum: 4
  validated_data_only: true
  placeholder_forbidden: true
  require_methodology_note: true
  baseline_layout: two_column_when_possible

html:
  self_contained: true
  external_cdn: false
  external_fonts: false
  remote_images: false
  fixed_navigation: true
  responsive: true
  print_friendly: true
  baseline_spec: config/cross_asset/format_baseline.yaml
  preserve_2026_07_31_structure: true
  title_must_follow_artifact_naming: true

format_change_control:
  default: incremental_only
  approved_exceptions:
    - approved_on: '2026-07-31'
      scope: 优化当下市场定价、资金仓位与产业数据及双账本内部结构，并增加板块轮动；不改变模块顺序和整体主题
  user_approval_required_for:
    - section_reorder
    - fixed_section_removal
    - navigation_change
    - market_map_column_change
    - visual_theme_replacement
    - future_dual_ledger_structure_change_outside_approved_scope
    - pricing_vs_research_partition_change

internal_quality_operations:
  enabled: true
  governed_by_shared_config: true
  client_facing_section: false
  purpose: 保证数据真实性、稳定性和持续优化，不作为晨报客户阅读栏目

quality_gate:
  no_template_numbers: true
  no_estimates_as_actual: true
  unavailable_text_from_contract: true
  official_or_cross_source_for_headlines: true
  all_key_numbers_require_timestamp: true
  format_lock_does_not_force_empty_content: true
  filename_must_match_canonical_pattern: true
  no_generic_preview_filename: true
