schema_version: 1
policy_id: cross_asset_content_integrity_v1
status: active
purpose: 严禁AI幻觉、虚假陈述、未经核验的精确数字和伪造因果归因

hard_principles:
  - 不知道就不写，无法核验就删除或明确写数据暂缺
  - 不得将推断、印象、模型常识或历史记忆写成当天事实
  - 不得为了版面完整而补齐数字、事件、共识、公司指引、资金流或仓位数据
  - 不得把新闻标题、搜索摘要或二手转述中的数字直接当作已核验原始数据
  - 不得使用未来信息解释历史日期的晨报

claim_classes:
  numeric_market_data:
    required_evidence:
      - source_id
      - source_url
      - exact_instrument
      - market_timestamp
      - fetched_at
      - unit
      - currency
      - value_basis
    minimum_quality: official_verified_or_cross_source_consistent
  macro_actual:
    required_evidence:
      - official_release_or_statistical_agency
      - release_time
      - statistical_period
      - unit_and_adjustment_basis
    minimum_quality: official_verified
  macro_consensus:
    required_evidence:
      - named_consensus_provider_or_named_news_source
      - publication_time
      - exact_measure_definition
    on_missing: omit_consensus_cell_or_write未取得可核验一致预期
  company_financial_metric:
    preferred_sources:
      - official_investor_relations_release
      - sec_filing
      - exchange_filing
    fallback_rule: 两个独立权威来源数值一致后方可使用
  policy_or_regulatory_event:
    required_evidence:
      - official_document_or_regulator_release
      - stage_of_process
      - exact_date
    prohibited:
      - 将提案写成已生效
      - 将媒体讨论写成正式政策
      - 将单一评论写成监管共识
  causal_statement:
    rule: 来源明确归因时才可写确定性因果；否则使用“可能与……相关”“市场普遍将……视为因素之一”等限定表达
    prohibited:
      - 仅凭同日涨跌推断唯一原因
      - 将相关性写成因果
  research_inference:
    required_display: 明确标注为判断、推断或待验证假设
    required_support: 至少两条已核验事实或一条官方事实加一条市场证据

retrieval_protocol:
  before_marking_missing:
    - 检查代码和市场映射
    - 检查交易日与时区
    - 调用首选源
    - 调用至少两个独立备源或一个官方备源
    - 检查是否存在历史日期接口或官方归档
    - 检查是否误用现货、期货、ETF、指数或错误合约
  minimum_attempts:
    critical_market_map_field: 3
    headline_macro_or_company_metric: 3
    noncritical_supporting_metric: 2
  stop_conditions:
    - 发现来源冲突且无法解释口径差异
    - 只有搜索摘要没有正文或原始数据
    - 时间戳不匹配
    - 单位或合约无法确认
    - 数据疑似陈旧

missing_data_policy:
  critical_required_field: 显示“数据暂缺”，并保留资产名称和应有时点
  noncritical_field: 直接省略，不为完整性强行展示缺失卡片
  historical_value_in_latest_column: prohibited
  approximate_value_without_source: prohibited
  range_without_source: prohibited
  proxy_without_explicit_label: prohibited

consistency_checks:
  - 标题日期、数据时点和事件日期不得互相冲突
  - 同一资产在市场地图、图表、正文和账本中的数字必须一致
  - 同一公司财务数据在正文和研究卡片中必须一致
  - 涨跌方向必须与数值变化一致
  - 百分比、基点、绝对值和币种不得混用
  - 24小时涨跌不得与交易日涨跌混用
  - 指数点位不得由ETF价格替代
  - 期货不得省略合约月份

anti_hallucination_gate:
  before_render:
    - 建立事实清单
    - 为每个数字绑定来源与时点
    - 将推断与事实分栏检查
    - 删除所有无来源精确数字
    - 删除所有无法证明的唯一因果表述
    - 检查未来信息泄漏
    - 检查重复内容中的数字一致性
  fail_action:
    - 阻止正式HTML生成
    - 输出可核验的缩减版而非完整但虚假的版本
  client_visible_audit_log: false

language_rules:
  avoid_false_certainty:
    - 确认
    - 必然
    - 证明
    - 导致
  allowed_when_supported:
    - 官方数据显示
    - 公司公告显示
    - 两个独立来源一致显示
  cautious_inference_phrases:
    - 可能与……有关
    - 市场反应与……一致
    - 目前证据更支持……
    - 尚不能排除……
    - 仍需由……验证
