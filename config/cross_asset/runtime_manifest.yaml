schema_version: 7
pipeline_id: cross_asset_morning_brief_v6
status: active
updated_at: '2026-08-11T08:37:00+08:00'
purpose: 网页GPT负责研究、数据核验与内容payload；GitHub保存规则并在计划任务场景承担确定性render/validate/archive尾段。互动聊天仍可在本地执行同一renderer并直接交付附件。

config_authority:
  canonical_entrypoint: config/cross_asset/runtime_manifest.yaml
  required_config_reads_is_authoritative_load_order: true
  on_required_config_read_failure: fail_closed
  prohibit_last_known_rules_fallback: true
  runtime_bundle:
    path: config/cross_asset/runtime_bundle.yaml
    required_bundle_id: cross_asset_runtime_2026_08_11_01
    execution_snapshot: true
    source_configs_remain_rule_editing_authority: true
    bundle_id_mismatch_action: fail_closed
  shared_data_domain_owners:
    data_contract: config/shared/data_contract.yaml
    sources: config/shared/sources.yaml
    routing: config/shared/routing.yaml
    quality: config/shared/quality_rules.yaml
    instruments: config/shared/instruments.yaml
    market_calendar: config/shared/report_calendar.yaml

required_config_reads:
  - vendor/upstreams.lock.yaml
  - config/shared/data_contract.yaml
  - config/shared/sources.yaml
  - config/shared/routing.yaml
  - config/shared/quality_rules.yaml
  - config/shared/instruments.yaml
  - config/shared/report_calendar.yaml
  - config/cross_asset/runtime_bundle.yaml
  - config/cross_asset/research_ledger.yaml
  - config/cross_asset/report_payload.schema.json
  - config/cross_asset/automation_delivery.yaml
  - templates/cross_asset/cross_asset_v4_2026_08_08.html
  - scripts/cross_asset/render_report.py
  - scripts/cross_asset/validate_report.py
  - .github/workflows/cross_asset_render_report.yml

common_pipeline_steps:
  - read_runtime_manifest_first
  - read_and_parse_all_required_configs
  - verify_runtime_bundle_id_equals_manifest_required_bundle_id
  - identify_execution_context_as_scheduled_task_or_interactive_chat
  - resolve_official_market_calendars_and_special_closures
  - decide_publish_or_skip_from_shared_calendar_policy
  - if_skipped_end_without_user_message_or_artifact
  - collect_and_normalize_market_data
  - perform_source_timestamp_unit_instrument_and_independence_validation
  - add_weekly_outlook_on_monday_or_deferred_first_open_day
  - update_research_reasoning_without_using_stale_evidence_as_daily_increment
  - build_verified_report_content
  - create_structured_report_payload_json_matching_schema
  - freeze_scheduled_inline_report_inside_payload_before_any_rendering_or_delivery

scheduled_task_pipeline_steps:
  - do_not_attempt_direct_chat_file_attachment
  - write_payload_to_production_cross_asset_payloads_date_path_on_main
  - github_actions_must_render_locked_template_validate_and_archive
  - wait_for_matching_validation_receipt_with_status_validated
  - verify_receipt_report_date_template_id_and_html_path
  - read_back_archived_html_identity_meta
  - send_report_payload_scheduled_inline_report_verbatim
  - append_only_the_validated_report_artifact_link
  - do_not_generate_second_summary_or_second_html

interactive_chat_pipeline_steps:
  - materialize_exact_template_renderer_and_validator_to_local_runtime
  - run_renderer_against_locked_template_and_payload
  - run_validator_against_rendered_html_and_locked_template
  - if_validation_failed_do_not_archive_or_claim_html_success
  - attach_exact_same_local_validated_html_file
  - archive_exact_same_validated_html_bytes_in_background
  - send_payload_scheduled_inline_report_and_direct_attachment_once

hard_gates:
  config_read_success_required: true
  runtime_bundle_id_match_required: true
  official_calendar_resolution_required: true
  special_closure_check_required: true
  publication_decision_required: true
  minimum_verified_market_assets: 6
  template_id_required: cross_asset_v4_2026_08_08
  freehand_html_generation_prohibited: true
  html_validator_required: true
  css_fingerprint_match_required: true
  javascript_fingerprint_match_required: true
  baseline_conformance_required_for_html: true
  prohibit_summary_only_success: true
  prohibit_unverified_claim_of_pipeline_execution: true
  single_enabled_0800_task_rule_required: true
  scheduled_task:
    payload_write_required: true
    github_actions_render_required: true
    validated_receipt_required: true
    canonical_inline_copy_required: true
    second_summary_generation_prohibited: true
    direct_chat_attachment_required: false
    direct_chat_attachment_attempt_prohibited: true
    validated_html_artifact_link_required: true
    unvalidated_github_link_prohibited: true
  interactive_chat:
    deterministic_local_renderer_required: true
    direct_downloadable_attachment_required: true
    github_link_as_attachment_substitute_prohibited: true

rendering_assets:
  template_id: cross_asset_v4_2026_08_08
  golden_reference_report: reports/cross_asset/2026/08/跨资产交易晨报_2026-08-08.html
  template_path: templates/cross_asset/cross_asset_v4_2026_08_08.html
  payload_schema_path: config/cross_asset/report_payload.schema.json
  renderer_path: scripts/cross_asset/render_report.py
  validator_path: scripts/cross_asset/validate_report.py
  scheduled_workflow_path: .github/workflows/cross_asset_render_report.yml
  scheduled_payload_pattern: production/cross_asset/payloads/{year}/{month}/report_payload_{date}.json
  scheduled_receipt_pattern: production/cross_asset/receipts/{year}/{month}/render_{date}.json
  local_payload_pattern: /mnt/data/cross_asset_report_payload_{date}.json
  local_html_pattern: /mnt/data/跨资产交易晨报_{date}.html
  required_execution_contract:
    - 模型只生成payload内容片段，不重新设计HTML页面。
    - 模板、CSS、JS、导航、阅读模式和主section顺序只能来自template_path。
    - payload片段不得包含style、script、section等结构控制标签。
    - 计划任务由GitHub Actions实际执行renderer和validator；不得声称模型自检等同于机器校验。
    - 互动聊天使用同一renderer和validator生成本地附件。
    - 任何场景都不得在renderer或validator失败时退回自由手写HTML。

weekly_module:
  due: monday_or_deferred_first_open_day
  required:
    - 本周交易日与假期安排
    - 本周重要宏观、政策、财报、产业和商品事件
    - 本周主要风险与验证节点
  once_per_week: true

artifact_identity:
  html_meta_name: market-brief-pipeline
  html_meta_content: cross_asset_morning_brief_v6
  html_template_meta_name: market-brief-template
  html_template_meta_content: cross_asset_v4_2026_08_08
  filename_pattern: 跨资产交易晨报_{date}.html
  local_path_pattern: /mnt/data/跨资产交易晨报_{date}.html
  archive_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html
  single_html_artifact_per_date: true

scheduled_task_delivery:
  destination: task_associated_chat
  required:
    - payload_scheduled_inline_report_verbatim
    - one_validated_report_artifact_link
    - client_facing_copy_only
  report_artifact_url_pattern: https://github.com/wuxingyuenan5-lgtm/market-brief-data-hub/blob/main/reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html?raw=1
  prohibited:
    - sandbox_or_local_attachment_claim
    - second_html_generation
    - second_summary_generation
    - github_repository_path_or_commit_hash_in_body
    - link_before_validation_receipt
    - success_claim_when_receipt_missing_or_failed

interactive_chat_delivery:
  required:
    - payload_scheduled_inline_report
    - direct_downloadable_html_attachment
  prohibited:
    - github_link_as_substitute
    - preview_wrapper
    - broken_attachment_success

automation_governance:
  scheduled_time: '08:00'
  timezone: Asia/Shanghai
  manager_chat: 跨资产交易晨报｜每日生产
  rules_control_chat: 跨资产交易晨报｜规则与研究中枢
  single_enabled_cross_asset_task_required: true
  rules_control_chat_must_not_create_rebind_or_duplicate_task: true
  rule_changes_must_not_recreate_task: true
  task_prompt_policy: 保持短提示；明确这是scheduled context，读取runtime_manifest后执行scheduled_task_pipeline，不复制全部长期规则正文。
  runtime_task_inventory_check_required_before_task_change: true

failure_messages:
  config_or_data_gate_failed: 今日晨报未通过数据与配置校验，未发送半成品。
  scheduled_payload_failed: 今日晨报内容已完成核验，但生产payload提交失败，未生成正式HTML。
  scheduled_render_failed: 今日晨报内容已完成核验，但固定模板机器渲染或校验未通过，未发送错误版HTML。
  scheduled_receipt_missing: 今日晨报内容已完成核验，但正式HTML尚未取得机器校验通过凭证，未发送未验证成品。
  interactive_attachment_failed: 今日晨报HTML附件交付失败，未以GitHub链接替代。
