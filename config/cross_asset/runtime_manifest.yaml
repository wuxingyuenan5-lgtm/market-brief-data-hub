schema_version: 9
pipeline_id: cross_asset_morning_brief_v7
status: active
updated_at: '2026-08-11T09:08:00+08:00'
purpose: GitHub继续作为长期规则源与历史归档，但不再作为08:00计划任务的每日运行时配置服务。规则变更在发布时编译并同步进现有计划任务Prompt；日常任务直接使用内置规则生产，最后仅best-effort归档最终HTML到GitHub。

architecture:
  rules_source_of_truth: github_source_configs
  scheduled_runtime_authority: embedded_automation_prompt
  compiled_prompt_path: config/cross_asset/scheduled_task_prompt.md
  active_prompt_version: cross_asset_embedded_2026_08_11_01
  html_visual_source: templates/cross_asset/cross_asset_v4_2026_08_08.html
  historical_archive_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html

rule_activation:
  source_rule_change_is_not_live_until_prompt_sync: true
  normal_release_sequence:
    - 修改并审核GitHub源规则
    - 重新编译config/cross_asset/scheduled_task_prompt.md
    - 将编译后的Prompt完整同步到唯一启用的08:00跨资产任务
    - 记录automation_sync状态
  when_rules_are_changed_from_rules_control_chat: 同一轮自动完成GitHub提交和任务Prompt同步，不要求用户手工复制粘贴
  when_github_is_edited_outside_rules_control_chat: 新规则暂不进入每日生产；用户回到规则中枢执行一次“同步跨资产晨报规则到自动任务”后生效
  prohibit_daily_polling_for_rule_changes: true
  prohibit_webhook_or_background_rule_sync_dependency: true

scheduled_task_runtime:
  daily_github_rule_reads_required: false
  daily_github_rule_reads_prohibited: true
  daily_github_template_reads_prohibited: true
  daily_github_research_ledger_reads_prohibited: true
  task_must_not_read_runtime_manifest_at_run_start: true
  task_must_not_read_runtime_bundle_at_run_start: true
  runtime_rules_are_fully_embedded_in_task_prompt: true
  github_interaction_budget:
    rule_reads: 0
    archive_writes_maximum: 1
    archive_readback_required: false
  execution_sequence:
    - 使用任务Prompt内置规则解析官方交易日和是否发布
    - 搜索并核验市场数据与事件
    - 完成完整晨报研究和写作
    - 冻结FINAL_CHAT_COPY
    - 使用任务Prompt内嵌固定HTML母版生成唯一一次正式本地HTML
    - 在GitHub交互前完成本地HTML结构与内容一致性校验
    - 冻结正式HTML文件与FINAL_CHAT_COPY
    - 最后best_effort写入GitHub历史归档，不读取任何GitHub规则文件
    - 无论归档成功与否均不得重写已冻结正文或HTML
    - 最终交付冻结正文和真实可下载HTML附件

scheduled_delivery:
  direct_downloadable_html_attachment_required: true
  filename_pattern: 跨资产交易晨报_{date}.html
  local_path_pattern: /mnt/data/跨资产交易晨报_{date}.html
  attachment_is_primary_file_delivery: true
  github_archive_is_not_customer_delivery: true
  github_link_should_not_replace_attachment: true
  archive_failure_must_not_block_or_change_valid_customer_delivery: true
  freeze_before_archive_required: true
  second_summary_after_archive_prohibited: true
  second_html_after_archive_prohibited: true

content_and_data_authority:
  compiled_into_scheduled_prompt_from:
    - vendor/upstreams.lock.yaml
    - config/shared/data_contract.yaml
    - config/shared/sources.yaml
    - config/shared/routing.yaml
    - config/shared/quality_rules.yaml
    - config/shared/instruments.yaml
    - config/shared/report_calendar.yaml
    - config/cross_asset/artifact_naming.yaml
    - config/cross_asset/client_presentation.yaml
    - config/cross_asset/content_integrity.yaml
    - config/cross_asset/section_design.yaml
    - config/cross_asset/research_accumulation.yaml
    - config/cross_asset/user_experience.yaml
    - templates/cross_asset/cross_asset_v4_2026_08_08.html
  source_files_remain_for_rule_maintenance_and_audit: true
  daily_task_does_not_need_to_understand_source_file_graph: true

research_continuity:
  scheduled_task_may_use_prior_successful_outputs_in_same_task_thread: true
  prior_output_may_support_view_continuity_only: true
  prior_market_numbers_must_be_reverified_before_current_use: true
  github_research_ledger_not_required_for_daily_task: true

interactive_chat:
  may_read_github_when_user_explicitly_requests_current_rule_or_repo_work: true
  may_use_local_renderer_and_validator: true
  direct_downloadable_html_attachment_required_when_generating_formal_report: true

hard_gates:
  official_calendar_resolution_required: true
  critical_data_truthfulness_required: true
  exactly_three_market_mainlines_required: true
  fixed_template_required: true
  one_html_artifact_per_run_required: true
  html_local_validation_before_archive_required: true
  final_chat_copy_freeze_before_archive_required: true
  direct_attachment_required: true
  archive_failure_is_non_blocking: true
  github_rule_read_during_scheduled_run_is_architecture_violation: true

failure_behavior:
  data_gate_failed: 今日晨报未通过数据核验，未发送半成品。
  html_gate_failed: 今日晨报HTML成品校验失败，未发送错误版文件。
  archive_failed: internal_only_do_not_change_customer_delivery

automation_governance:
  scheduled_time: '08:00'
  timezone: Asia/Shanghai
  task_title: 跨资产交易晨报
  task_id: 6a4f8f4735348191af34a90274406e98
  single_enabled_task_required: true
  rule_change_updates_existing_task_in_place: true
  rule_change_must_not_create_duplicate_task: true
  prompt_version_must_match_active_prompt_version: true
