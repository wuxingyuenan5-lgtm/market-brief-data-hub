schema_version: 4
pipeline_id: cross_asset_morning_brief_v6
status: active
updated_at: '2026-08-04T10:05:00+08:00'
purpose: 计划任务与互动聊天共用同一研究与版式规则，但按运行环境选择可实现的交付方式；计划任务优先保证关联聊天正文可用，互动聊天优先交付正式HTML附件

required_config_reads:
  - vendor/upstreams.lock.yaml
  - config/shared/data_contract.yaml
  - config/shared/sources.yaml
  - config/shared/routing.yaml
  - config/shared/quality_rules.yaml
  - config/shared/instruments.yaml
  - config/shared/report_calendar.yaml
  - config/cross_asset/artifact_naming.yaml
  - config/cross_asset/client_presentation.yaml
  - config/cross_asset/content_integrity.yaml
  - config/cross_asset/automation_delivery.yaml
  - config/cross_asset/format_baseline.yaml
  - config/cross_asset/section_design.yaml
  - config/cross_asset/research_accumulation.yaml
  - config/cross_asset/research_ledger.yaml
  - config/cross_asset/user_experience.yaml
  - config/cross_asset/report.yaml
  - docs/DATA_PROTOCOL.md

required_pipeline_steps:
  - read_and_parse_all_required_configs
  - identify_execution_context_as_scheduled_task_or_interactive_chat
  - resolve_official_market_calendars_and_special_closures
  - decide_publish_or_skip_from_shared_calendar_policy
  - if_skipped_end_without_user_message_or_artifact
  - collect_and_normalize_market_data
  - perform_source_timestamp_unit_and_instrument_validation
  - add_weekly_outlook_on_monday_or_deferred_first_open_day
  - build_verified_report_content
  - render_self_contained_html_using_locked_baseline_when_file_tools_are_available
  - validate_html_artifact_when_generated
  - archive_completed_html_in_background_when_generated
  - deliver_according_to_automation_delivery_execution_context

hard_gates:
  config_read_success_required: true
  official_calendar_resolution_required: true
  special_closure_check_required: true
  publication_decision_required: true
  minimum_verified_market_assets: 6
  baseline_id_required: cross_asset_v4_2026_07_31
  baseline_conformance_required_for_html: true
  prohibit_github_link_in_customer_delivery: true
  prohibit_summary_only_success: true
  prohibit_unverified_claim_of_pipeline_execution: true
  scheduled_task_inline_report_required: true
  scheduled_task_attachment_required: false
  interactive_chat_direct_attachment_required: true

weekly_module:
  due: monday_or_deferred_first_open_day
  required:
    - 本周交易日与假期安排
    - 本周重要宏观、政策、财报、产业和商品事件
    - 本周主要风险与验证节点
  once_per_week: true

artifact_identity:
  html_meta_name: market-brief-pipeline
  html_meta_content: cross_asset_morning_brief_v6
  filename_pattern: 跨资产交易晨报_{date}.html
  local_path_pattern: /mnt/data/跨资产交易晨报_{date}.html
  archive_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html

scheduled_task_delivery:
  destination: task_associated_chat
  required:
    - usable_inline_report
    - client_facing_copy_only
    - no_internal_process_messages
    - no_github_link
  optional:
    - direct_html_attachment_when_runtime_supports_real_file_creation
  attachment_unavailable_action: send_verified_inline_report_without_failure_notice

interactive_chat_delivery:
  required:
    - concise_chat_summary
    - direct_downloadable_html_attachment
  prohibited:
    - github_link_as_substitute
    - preview_wrapper
    - broken_attachment_success

failure_messages:
  config_or_data_gate_failed: 今日晨报未通过数据与配置校验，未发送半成品。
  interactive_attachment_failed: 今日晨报HTML附件交付失败，未以GitHub链接替代。
