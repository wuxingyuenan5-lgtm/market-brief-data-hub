schema_version: 2
module_id: cross_asset_research_accumulation_trial
status: active
start_date: '2026-08-01'
reversible: true
removal_policy: 用户判断呈现效果不佳时，可删除本文件并从report.yaml移除引用，不影响公共数据层与格式基线

review:
  completed_at: '2026-08-08T17:28:00+08:00'
  outcome: retain_and_promote_to_active
  rationale:
    - 增量展示原则与content_integrity和format_baseline一致
    - 模块已被report、baseline和user_experience稳定引用
    - 保留可逆删除机制，不改变主模块顺序
  compatibility_note: module_id保留trial后缀仅为兼容既有内部锚点，不代表当前仍处于试运行状态

canonical_state_model:
  authority: this_file
  change_statuses:
    - new
    - strengthened
    - weakened
    - falsified
    - unchanged
  maturity_stages:
    - hypothesis_formed
    - initial_evidence
    - multi_source_validated
    - market_pricing_started
    - mature
    - crowded
    - falsification_phase
    - closed
  semantics:
    change_status: 描述相较上一份有效晨报的证据变化，不等同于研究成熟度
    maturity_stage: 描述研究主题所处的长期验证阶段，不以单日涨跌直接改变
  prohibited_legacy_stage_values:
    - hypothesis
    - multi_source_validation
    - crowded_or_consensus
    - falsification_watch
  migration_rule: 发现旧枚举时先映射到canonical_state_model，不得新增同义状态

principles:
  - 不改变90秒决策区和三条市场主线的原有写法
  - 只展示真正新增、强化、弱化或证伪的研究信息
  - 不为填满模块而重复旧结论
  - 研究积累服务于持续验证，不直接包装成交易建议
  - 每日新增展示应简洁，完整状态保存在研究账本中

modules:
  consensus_hypothesis_library:
    enabled: true
    display_title: 市场共识与关键假设
    maximum_visible_items: 3
    required_fields:
      - hypothesis_id
      - topic
      - current_market_consensus
      - our_observation
      - conditions_required
      - earliest_falsification_indicator
      - change_status
    change_status_source: canonical_state_model.change_statuses
    hide_unchanged_by_default: true

  valuation_fundamental_bridge:
    enabled: true
    display_title: 估值—基本面桥梁
    maximum_visible_items: 2
    preferred_topics: [ai_technology, us_equities, gold_miners, copper_equities, lithium_equities]
    required_fields:
      - topic
      - current_valuation_context
      - earnings_or_cashflow_expectation
      - implied_assumption
      - new_fundamental_evidence
      - valuation_framework_impact
    rules:
      - 无可靠估值或盈利数据时不生成
      - 不用历史分位替代当前可核验估值
      - 明确区分资产价格、公司估值和商品基本面

  cross_asset_transmission_matrix:
    enabled: true
    display_title: 跨资产传导与背离
    maximum_visible_shocks: 2
    tracked_assets: [rates, dollar, gold, copper, bitcoin, us_technology, cn_hk_equities]
    required_fields:
      - shock_variable
      - conventional_transmission
      - observed_transmission
      - divergence
      - interpretation
      - next_validation
    rules:
      - 只展示当日存在明显传导或背离的冲击
      - 标准传导是分析基准，不是机械预测
      - 背离必须给出数据证据和可验证解释

  research_maturity_stage:
    enabled: true
    display_title: 研究主题成熟度
    stage_source: canonical_state_model.maturity_stages
    required_fields:
      - ledger_id
      - topic
      - previous_stage
      - current_stage
      - transition_evidence
      - next_node
    display_only_stage_changes: true

storage:
  ledger_path: config/cross_asset/research_ledger.yaml
  preserve_history: true
  stable_ids_required: true
  daily_report_shows_increment_only: true
  state_model_source: config/cross_asset/research_accumulation.yaml
