schema_version: 9
policy_id: cross_asset_automation_delivery_v9
status: active
updated_at: '2026-08-11T09:08:00+08:00'
purpose: 恢复计划任务原本更稳定的“内置规则直接生产”模式。GitHub不参与日常规则读取和中间生产，只在客户成品冻结后做一次best-effort历史归档。

automation_ownership:
  scheduled_time: '08:00'
  timezone: Asia/Shanghai
  task_title: 跨资产交易晨报
  task_id: 6a4f8f4735348191af34a90274406e98
  single_enabled_cross_asset_task_required: true
  update_existing_task_in_place: true
  duplicate_task_prohibited: true
  live_prompt_path_for_audit: config/cross_asset/scheduled_task_prompt.md
  live_prompt_version: cross_asset_embedded_2026_08_11_01

scheduled_task:
  runtime_rule_source: embedded_automation_prompt
  github_rule_reads_per_run: 0
  github_template_reads_per_run: 0
  github_research_ledger_reads_per_run: 0
  primary_delivery: frozen_inline_report_plus_direct_html_attachment
  direct_attachment_required: true
  required_local_path: /mnt/data/跨资产交易晨报_{date}.html
  attachment_name_pattern: 跨资产交易晨报_{date}.html
  rules:
    - 先依据内置规则完成交易日判断、研究、数据核验和写作。
    - 在任何GitHub交互前冻结FINAL_CHAT_COPY。
    - 在任何GitHub交互前使用内嵌固定母版生成并校验真实HTML文件。
    - 将FINAL_CHAT_COPY与本地HTML视为已经完成的客户成品，后续不得重写。
    - 最后最多进行一次GitHub归档写入；归档不属于客户交付链。
    - GitHub归档成功、失败或同名文件冲突均不得触发第二次总结、第二份HTML或附件替换。
    - 最终必须发送冻结正文和真实本地HTML附件。
  prohibited:
    - read_runtime_manifest_during_daily_run
    - read_runtime_bundle_during_daily_run
    - read_template_from_github_during_daily_run
    - read_research_ledger_from_github_during_daily_run
    - github_link_as_attachment_substitute
    - second_html_after_archive
    - second_summary_after_archive
    - regenerate_customer_output_due_to_archive_result

interactive_chat:
  primary_delivery: concise_summary_plus_direct_html_attachment
  direct_attachment_required: true
  required_local_path: /mnt/data/跨资产交易晨报_{date}.html
  may_read_current_github_rules_when_user_requests_repo_or_rule_work: true

common_html:
  canonical_filename: 跨资产交易晨报_{date}.html
  title_pattern: 跨资产交易晨报｜{date}
  h1_pattern: 跨资产交易晨报｜{date}
  self_contained: true
  template_id: cross_asset_v4_2026_08_08
  visual_contract_compiled_into_task_prompt: true
  fixed_reading_modes: [全部, 概览, 研究]
  exact_theme_card_count: 3
  required_sections:
    - 90秒摘要
    - 隔夜宏观
    - 数据图表
    - 市场概览
    - 市场主线
    - 重点信息
    - 资金、仓位与产业数据
    - 跟踪表
    - 前期观点复盘
    - 今日关注与未来7天事件
    - 来源与口径
  conditional_sections:
    研究更新: material_increment_only
    研究跟踪: changed_items_only
  external_dependencies_prohibited: true

archive:
  enabled: true
  mode: best_effort_after_customer_artifact_freeze
  repository: wuxingyuenan5-lgtm/market-brief-data-hub
  branch: main
  path_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html
  content_must_match_local_html: true
  maximum_github_writes_per_normal_run: 1
  archive_readback_required: false
  archive_failure_blocks_delivery: false
  archive_failure_customer_visible: false
  archive_result_may_not_change_final_copy_or_attachment: true

failure_behavior:
  data_gate_failed: 今日晨报未通过数据核验，未发送半成品。
  html_or_attachment_failed: 今日晨报HTML成品校验失败，未发送错误版文件。
  archive_failed: internal_only_continue_valid_customer_delivery

rule_sync:
  daily_polling_for_github_rule_changes: false
  rule_update_from_rules_control_chat: GitHub规则提交后同一轮重新编译scheduled_task_prompt并更新现有08:00任务Prompt
  external_github_edit: 需在规则中枢执行一次同步后才进入自动任务
