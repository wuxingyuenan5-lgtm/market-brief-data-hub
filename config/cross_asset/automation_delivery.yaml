schema_version: 7
policy_id: cross_asset_automation_delivery_v7
status: active
updated_at: '2026-08-11T08:37:00+08:00'
purpose: 计划任务与互动聊天使用同一研究规则和同一HTML母版，但按实际运行能力采用不同交付方式。计划任务不得再生成或伪装聊天附件；互动聊天继续交付真实可下载HTML附件。

runtime_capability_boundary:
  observed_on: '2026-08-11'
  scheduled_tasks:
    direct_generated_file_attachment_is_not_a_supported_success_assumption: true
    project_files_are_not_runtime_inputs: true
    consequence: 计划任务必须以GitHub中机器渲染并通过validator的唯一HTML成品为正式文件，不得创建第二份聊天HTML或虚构附件。
  interactive_chat:
    local_file_creation_and_direct_attachment_may_be_used_when_available: true

automation_ownership:
  scheduled_time: '08:00'
  timezone: Asia/Shanghai
  manager_chat: 跨资产交易晨报｜每日生产
  rules_control_chat: 跨资产交易晨报｜规则与研究中枢
  single_enabled_cross_asset_task_required: true
  rules_control_chat_must_not_create_rebind_or_duplicate_task: true
  rule_changes_must_not_recreate_task: true
  task_prompt_must_remain_short: true
  task_prompt_required_instruction: 读取config/cross_asset/runtime_manifest.yaml并按当前execution_context执行
  before_any_task_change: 必须先核验现有跨资产08:00任务清单，避免重复启用任务

execution_contexts:
  scheduled_task:
    production_mode: research_payload_to_github_actions
    primary_delivery: canonical_inline_report_plus_validated_html_link
    payload_repository_pattern: production/cross_asset/payloads/{year}/{month}/report_payload_{date}.json
    validation_receipt_pattern: production/cross_asset/receipts/{year}/{month}/render_{date}.json
    html_archive_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html
    required_sections_in_inline_report:
      - 90秒摘要
      - 市场概览
      - 三条市场主线
      - 今日关注与风险
      - 周度模块到期时的本周交易安排与本周展望
    canonical_inline_copy_source: report_payload.scheduled_inline_report
    canonical_inline_copy_must_be_sent_verbatim: true
    second_summary_generation_after_payload_is_prohibited: true
    direct_chat_attachment_required: false
    direct_chat_attachment_attempt_prohibited: true
    validated_html_link_required: true
    validated_html_link_may_only_be_sent_after_receipt_status_validated: true
    github_link_exception_scope: only_the_validated_report_artifact
    github_repository_paths_commit_hashes_and_tool_status_remain_hidden: true
    rules:
      - 计划任务先完成研究、数据核验和report payload，不直接编写完整HTML。
      - payload必须写入GitHub指定生产目录，以触发GitHub Actions固定renderer和validator。
      - 在validation receipt出现且status=validated前不得发送正式成品链接。
      - 聊天正文必须逐字使用payload中的scheduled_inline_report，不得在最后一步重新概括、改写或追加新的市场判断。
      - 最终不得创建sandbox附件、伪附件、preview文件或第二份HTML。
      - 若Actions渲染失败或receipt未通过，则发送固定失败信息，不得退回自由手写HTML。

  interactive_chat:
    production_mode: local_deterministic_render_when_file_runtime_available
    primary_delivery: canonical_inline_report_plus_direct_html_attachment
    canonical_inline_copy_source: report_payload.scheduled_inline_report
    direct_attachment_required: true
    required_local_path: /mnt/data/跨资产交易晨报_{date}.html
    github_customer_link_allowed: false
    rules:
      - 正式HTML附件必须由固定template、renderer和validator生成并可直接下载。
      - 附件名称必须为跨资产交易晨报_{date}.html。
      - 附件失败不得声称完成。

common_html:
  canonical_filename: 跨资产交易晨报_{date}.html
  title_pattern: 跨资产交易晨报｜{date}
  h1_pattern: 跨资产交易晨报｜{date}
  minimum_file_size_bytes: 12000
  self_contained: true
  template_id: cross_asset_v4_2026_08_08
  template_path: templates/cross_asset/cross_asset_v4_2026_08_08.html
  payload_schema_path: config/cross_asset/report_payload.schema.json
  renderer_path: scripts/cross_asset/render_report.py
  validator_path: scripts/cross_asset/validate_report.py
  scheduled_renderer: .github/workflows/cross_asset_render_report.yml
  freehand_html_generation_prohibited: true
  css_and_javascript_owned_by_template: true
  required_sections:
    - 90秒摘要
    - 隔夜宏观
    - 数据图表
    - 市场概览
    - 市场主线
    - 重点信息
    - 资金、仓位与产业数据
    - 跟踪表
    - 前期观点复盘
    - 今日关注与未来7天事件
    - 来源与口径
  conditional_sections:
    研究更新:
      minimum_count: 0
      maximum_count: 4
      omit_when_no_material_update: true
    研究跟踪:
      omit_when_no_material_change: true
  prohibited_visible_strings:
    - 分析已暂停
    - 仓库备份失败
    - 研究账本已同步
    - 提交为
    - commit
    - SHA
    - preview
    - 主线01
    - 主线02
    - 主线03
    - 当下定价
    - 系统性积累
    - 真实数据版

single_artifact_delivery:
  enabled: true
  one_html_artifact_per_report_date: true
  scheduled_task_canonical_artifact: validated_github_actions_output
  interactive_chat_canonical_artifact: validated_local_output
  github_archive_must_match_template_and_validator: true
  second_html_generation_after_validation_prohibited: true

background_archive:
  enabled: true
  scheduled_write_owner: github_actions
  interactive_write_owner: interactive_chat_after_local_validation
  archive_path_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html
  verify_after_write: true
  do_not_show_repository_path: true
  do_not_show_commit_hash: true

failure_behavior:
  scheduled_task:
    config_or_data_gate_failed: 今日晨报未通过数据与配置校验，未发送半成品。
    payload_write_failed: 今日晨报内容已完成核验，但生产payload未成功提交，未生成正式HTML。
    render_or_validation_failed: 今日晨报内容已完成核验，但固定模板渲染或HTML校验失败，未发送错误版HTML。
    receipt_timeout_or_missing: 今日晨报内容已完成核验，但正式HTML尚未取得机器校验通过凭证，未发送未验证成品。
  interactive_chat:
    attachment_failed: 今日晨报HTML附件交付失败，未以GitHub链接替代。

customer_quality:
  client_facing_language_only: true
  exact_numbers_require_source_timestamp_unit_and_basis: true
  inference_must_be_labeled_as_judgment: true
  unresolved_source_conflicts_must_be_excluded: true
  noncritical_missing_items_should_be_omitted: true
  never_claim_success_without_actual_delivery: true
