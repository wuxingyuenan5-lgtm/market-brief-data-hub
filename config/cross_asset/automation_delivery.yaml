schema_version: 5
policy_id: cross_asset_automation_delivery_v5
status: active
purpose: 区分计划任务与互动聊天的运行能力；计划任务不得因附件能力缺失而整份失败，互动聊天仍以可下载HTML附件为正式交付

automation_ownership:
  scheduled_time: '08:00'
  timezone: Asia/Shanghai
  manager_chat: 跨资产交易晨报｜每日生产
  rules_control_chat: 跨资产交易晨报｜规则与研究中枢
  single_enabled_cross_asset_task_required: true
  rules_control_chat_must_not_create_rebind_or_duplicate_task: true
  rule_changes_must_not_recreate_task: true
  task_prompt_must_remain_short: true
  task_prompt_required_instruction: 读取config/cross_asset/runtime_manifest.yaml并按当前pipeline执行
  before_any_task_change: 必须先核验现有跨资产08:00任务清单，避免重复启用任务

execution_contexts:
  scheduled_task:
    primary_delivery: associated_chat_inline_report
    minimum_chinese_characters: 900
    maximum_chinese_characters: 2200
    required_sections:
      - 90秒摘要
      - 市场概览
      - 三条市场主线
      - 今日关注与风险
      - 周度模块到期时的本周交易安排与本周展望
    conditional_material_sections:
      研究更新:
        minimum_count: 0
        maximum_count: 2
        rule: 仅在存在实质新增、强化、弱化或证伪时展示；不得为满足数量重复旧结论
    attachment_policy: best_effort
    attachment_failure_is_report_failure: false
    github_customer_link_allowed: false
    rules:
      - 先保证关联聊天中的报告正文可独立阅读
      - 若运行环境能够生成并附加真实HTML文件，则同时附加
      - 若运行环境不能创建可下载附件，不得只发送失败提示，不得以GitHub链接替代
      - 不输出完整市场表格时，市场概览至少覆盖6个已核验核心资产

  interactive_chat:
    primary_delivery: concise_summary_and_direct_html_attachment
    summary_minimum_chinese_characters: 250
    summary_maximum_chinese_characters: 700
    direct_attachment_required: true
    required_local_path: /mnt/data/跨资产交易晨报_{date}.html
    github_customer_link_allowed: false
    rules:
      - 正式HTML附件必须可直接下载
      - 附件名称必须为跨资产交易晨报_{date}.html
      - 附件失败不得声称完成

common_html:
  canonical_filename: 跨资产交易晨报_{date}.html
  title_pattern: 跨资产交易晨报｜{date}
  h1_pattern: 跨资产交易晨报｜{date}
  minimum_file_size_bytes: 12000
  self_contained: true
  baseline_id: cross_asset_v4_2026_07_31
  required_sections:
    - 90秒摘要
    - 隔夜宏观
    - 数据图表
    - 市场概览
    - 市场主线
    - 研究跟踪
    - 重点信息
    - 资金、仓位与产业数据
    - 跟踪表
    - 前期观点复盘
    - 今日关注与未来7天事件
    - 来源与口径
  conditional_sections:
    研究更新:
      minimum_count: 0
      maximum_count: 4
      omit_when_no_material_update: true
  prohibited_visible_strings:
    - 分析已暂停
    - 仓库备份失败
    - 研究账本已同步
    - 提交为
    - commit
    - SHA
    - preview
    - 主线01
    - 主线02
    - 主线03
    - 当下定价
    - 系统性积累
    - 真实数据版

background_archive:
  enabled: true
  customer_visible: false
  archive_path_pattern: reports/cross_asset/{year}/{month}/跨资产交易晨报_{date}.html
  write_method: raw_utf8_html_content
  verify_after_write: true
  do_not_show_github_link: true
  do_not_show_repository_path: true
  do_not_show_commit_hash: true
  archive_failure_must_not_block_valid_customer_delivery: true
  archive_failure_recording: internal_only

failure_behavior:
  scheduled_task:
    config_or_data_gate_failed: 今日晨报未通过数据与配置校验，未发送半成品。
    html_or_attachment_unavailable_but_inline_verified: 发送完整已核验正文，不发送GitHub链接，不把附件缺失写入客户正文
  interactive_chat:
    attachment_failed: 今日晨报HTML附件交付失败，未以GitHub链接替代。

customer_quality:
  client_facing_language_only: true
  exact_numbers_require_source_timestamp_unit_and_basis: true
  inference_must_be_labeled_as_judgment: true
  unresolved_source_conflicts_must_be_excluded: true
  noncritical_missing_items_should_be_omitted: true
  never_claim_success_without_actual_delivery: true
