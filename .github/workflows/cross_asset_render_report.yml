name: Cross-Asset Report Renderer

on:
  push:
    paths:
      - 'production/cross_asset/payloads/**/*.json'
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'Repository path to a cross-asset report payload JSON'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cross-asset-report-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-validate-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve payload path
        id: payload
        shell: bash
        env:
          DISPATCH_PAYLOAD: ${{ inputs.payload_path }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_PAYLOAD:-}" ]; then
            PAYLOAD="$DISPATCH_PAYLOAD"
          else
            PAYLOAD="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^production/cross_asset/payloads/.*\.json$' | head -n 1 || true)"
          fi
          test -n "$PAYLOAD"
          test -f "$PAYLOAD"
          echo "path=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Resolve report identity
        id: report
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='${{ steps.payload.outputs.path }}'
          REPORT_DATE="$(python - "$PAYLOAD" <<'PY'
import json, re, sys
p = sys.argv[1]
data = json.load(open(p, encoding='utf-8'))
d = str(data.get('report_date', ''))
if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', d):
    raise SystemExit('invalid report_date')
if data.get('pipeline_id') != 'cross_asset_morning_brief_v6':
    raise SystemExit('pipeline_id mismatch')
if data.get('template_id') != 'cross_asset_v4_2026_08_08':
    raise SystemExit('template_id mismatch')
inline = data.get('scheduled_inline_report', '')
if not isinstance(inline, str) or len(inline.strip()) < 300:
    raise SystemExit('scheduled_inline_report missing or too short')
print(d)
PY
)"
          YEAR="${REPORT_DATE:0:4}"
          MONTH="${REPORT_DATE:5:2}"
          OUTPUT="reports/cross_asset/${YEAR}/${MONTH}/跨资产交易晨报_${REPORT_DATE}.html"
          RECEIPT="production/cross_asset/receipts/${YEAR}/${MONTH}/render_${REPORT_DATE}.json"
          echo "date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "receipt=$RECEIPT" >> "$GITHUB_OUTPUT"

      - name: Render locked template
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cross_asset/render_report.py \
            --template templates/cross_asset/cross_asset_v4_2026_08_08.html \
            --payload '${{ steps.payload.outputs.path }}' \
            --output '${{ steps.report.outputs.output }}'

      - name: Validate rendered artifact
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cross_asset/validate_report.py \
            --html '${{ steps.report.outputs.output }}' \
            --template templates/cross_asset/cross_asset_v4_2026_08_08.html \
            --expected-date '${{ steps.report.outputs.date }}'

      - name: Write validation receipt
        shell: bash
        env:
          PAYLOAD: ${{ steps.payload.outputs.path }}
          OUTPUT: ${{ steps.report.outputs.output }}
          RECEIPT: ${{ steps.report.outputs.receipt }}
          REPORT_DATE: ${{ steps.report.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT")"
          python - <<'PY'
import hashlib, json, os
from pathlib import Path
payload = Path(os.environ['PAYLOAD'])
output = Path(os.environ['OUTPUT'])
receipt = Path(os.environ['RECEIPT'])
raw = output.read_bytes()
data = {
    'status': 'validated',
    'pipeline_id': 'cross_asset_morning_brief_v6',
    'template_id': 'cross_asset_v4_2026_08_08',
    'report_date': os.environ['REPORT_DATE'],
    'payload_path': str(payload),
    'html_path': str(output),
    'html_sha256': hashlib.sha256(raw).hexdigest(),
    'source_commit': os.environ.get('GITHUB_SHA', ''),
}
receipt.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
PY

      - name: Commit validated artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '${{ steps.report.outputs.output }}' '${{ steps.report.outputs.receipt }}'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'archive: render cross-asset morning brief ${{ steps.report.outputs.date }}'
          git push
